[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-local-ko"
version = "0.1.0"
description = "Local Korean transcripts from Korean and English audio."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "chaeyn"}]
keywords = ["whisper", "korean", "transcription", "tui", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Environment :: X11 Applications :: Tk",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "openai-whisper==20250625",
  "transformers==4.57.6",
  "sentencepiece==0.2.1",
  "sacremoses==0.1.1",
  "torch==2.8.0",
  "filelock==4.0.9",
  "windows-curses==2.4.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "twine>=6,<7", "ruff>=0.11,<1", "coverage>=7,<8"]

[project.scripts]
whisper-ko = "whisper_m4a:main"

[project.urls]
Homepage = "https://github.com/chaeyn/whisper-local-ko"
Issues = "https://github.com/chaeyn/whisper-local-ko/issues"
Documentation = "https://github.com/chaeyn/whisper-local-ko/tree/main/docs"

[tool.setuptools]
py-modules = ["whisper_m4a", "whisper_tui", "whisper_live", "whisper_platform"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
