name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Create virtual environment
        if: runner.os == 'Windows'
        run: python -m venv .venv
      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: |
          WHISPER_PYTHON="$(command -v python)" sh scripts/setup.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Test Windows installer
        if: runner.os == 'Windows'
        run: |
          ./scripts/setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$pwd\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install app and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check environment
        run: |
          python -m pip check
          whisper-ko --version
          whisper-ko doctor --no-gui --tui
      - name: Check syntax and names
        run: python -m ruff check .
      - name: Run tests
        run: python -m coverage run --source=whisper_m4a,whisper_tui,whisper_live,whisper_platform -m unittest discover -s tests -v
      - name: Report coverage
        run: python -m coverage report -m
      - name: Run real model and FFmpeg test
        if: matrix.python == '3.11'
        env:
          WHISPER_INTEGRATION: '1'
        run: python -m unittest discover -s tests -p test_integration.py -v
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Test installed wheel outside the source tree
        run: python scripts/check_wheel.py
      - name: Prepare release installer and checksums
        run: python scripts/prepare_release.py
      - name: Record installed dependencies
        run: python -m pip freeze > installed-dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*
            installed-dependencies.txt
          retention-days: 14
