name: Release installation
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, such as v0.1.2'
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    name: Release / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      # Do not check out the repository. Install only published release assets.
      - name: Download and verify the published installer or wheel
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import urllib.request
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a version tag such as v0.1.2.')
          base = f'https://github.com/chaeyn/whisper-local-ko/releases/download/{tag}'
          name = f'whisper_local_ko-{tag[1:]}-py3-none-any.whl' if os.name == 'nt' else 'install.sh'
          with urllib.request.urlopen(f'{base}/SHA256SUMS.txt', timeout=30) as response:
              manifest = dict(line.split()[::-1] for line in response.read().decode().splitlines())
          with urllib.request.urlopen(f'{base}/{name}', timeout=30) as response:
              content = response.read()
          if hashlib.sha256(content).hexdigest() != manifest.get(name):
              raise SystemExit('Release asset checksum mismatch.')
          target = Path(os.environ['RUNNER_TEMP']) / name
          target.write_bytes(content)
          print(f'Verified {name}. No source checkout is present.')
      - name: Install the shell release (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          WHISPER_PYTHON="$(command -v python)" sh "$RUNNER_TEMP/install.sh" --prefix "$RUNNER_TEMP/app data" --bin-dir "$RUNNER_TEMP/app bin"
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/app bin/whisper-ko" --version)" = "whisper-ko ${RELEASE_TAG#v}"
          "$RUNNER_TEMP/app bin/whisper-ko" doctor --no-gui --tui
      - name: Install the wheel release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $WhisperVenv = Join-Path $env:RUNNER_TEMP 'app data\.venv'
          python -m venv "$WhisperVenv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$WhisperVenv\Scripts\python.exe" -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$WhisperVenv\Scripts\python.exe" -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Wheel = Join-Path $env:RUNNER_TEMP "whisper_local_ko-$($env:RELEASE_TAG.Substring(1))-py3-none-any.whl"
          & "$WhisperVenv\Scripts\python.exe" -m pip install "$Wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          $Version = & "$WhisperVenv\Scripts\whisper-ko.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($Version -ne "whisper-ko $($env:RELEASE_TAG.Substring(1))") { throw 'Installed version mismatch.' }
          & "$WhisperVenv\Scripts\whisper-ko.exe" doctor --no-gui --tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
